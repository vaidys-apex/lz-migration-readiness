AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Network ACLs providing subnet-level defense-in-depth.
  Complements security groups with stateless packet filtering.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id

  WebSubnets:
    Type: CommaDelimitedList

  AppSubnets:
    Type: CommaDelimitedList

  DataSubnets:
    Type: CommaDelimitedList

Resources:
  # ---------- Web Tier NACL ----------
  WebNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: nacl-web-tier

  WebNaclInboundHttps:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref WebNacl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      CidrBlock: "0.0.0.0/0"
      PortRange:
        From: 443
        To: 443

  WebNaclInboundEphemeral:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref WebNacl
      RuleNumber: 200
      Protocol: 6
      RuleAction: allow
      CidrBlock: "0.0.0.0/0"
      PortRange:
        From: 1024
        To: 65535

  WebNaclOutbound:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref WebNacl
      RuleNumber: 100
      Protocol: 6
      Egress: true
      RuleAction: allow
      CidrBlock: "0.0.0.0/0"
      PortRange:
        From: 0
        To: 65535

  # ---------- Data Tier NACL (most restrictive) ----------
  DataNacl:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - Key: Name
          Value: nacl-data-tier

  DataNaclInboundPostgres:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataNacl
      RuleNumber: 100
      Protocol: 6
      RuleAction: allow
      CidrBlock: "10.0.0.0/8"
      PortRange:
        From: 5432
        To: 5432

  DataNaclInboundMysql:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataNacl
      RuleNumber: 110
      Protocol: 6
      RuleAction: allow
      CidrBlock: "10.0.0.0/8"
      PortRange:
        From: 3306
        To: 3306

  DataNaclDenyInternet:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref DataNacl
      RuleNumber: 900
      Protocol: -1
      RuleAction: deny
      CidrBlock: "0.0.0.0/0"

Outputs:
  WebNaclId:
    Value: !Ref WebNacl
  DataNaclId:
    Value: !Ref DataNacl
